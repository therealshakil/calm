# study — feed list (v1)
#
# The sources study gathers into its finite, prepared reading room — not a live feed.
# Curated 2026-07-15: researched (every feed fetched + verified live) and stress-tested by
# the calm-council. Principle: few, high-signal, low-noise, ND-friendly — no firehoses, no
# upsell, no anxious news-doom. Adding or removing a feed is a one-line edit + commit (spec 003).
#
# Geared to personal learning across four areas, plus one deliberate counterweight
# (the council flagged the risk of an all-agreeing echo chamber). `why` is the curation reason —
# it surfaces as the item's `why?` (specs 001/005).

# --- Neurodivergence ---------------------------------------------------------

[[feeds]]
title = "Neurodivergent Insights"
url = "https://neurodivergentinsights.substack.com/feed"
section = "Neurodivergence"
why = "Affirming, clinically-grounded essays on autism/ADHD (Dr Megan Anna Neff) — the anchor."

[[feeds]]
title = "Stimpunks Foundation"
url = "https://stimpunks.org/feed/"
section = "Neurodivergence"
why = "ND-led, practical guides on accessibility and ND-aware design — closest to how you build."

[[feeds]]
title = "Neurodivergent Rebel"
url = "https://neurodivergentrebel.com/feed"
section = "Neurodivergence"
why = "Long-running autistic/ADHD writing — anti-assimilation, lived-experience, and still active."

[[feeds]]
title = "The Autistic Advocate"
url = "https://theautisticadvocate.com/feed"
section = "Neurodivergence"
why = "UK advocacy, plain-spoken and affirming; low posting frequency keeps it calm."

# --- Agentic & AI engineering (incl. a deliberate skeptic) -------------------

[[feeds]]
title = "Simon Willison's Weblog"
url = "https://simonwillison.net/atom/everything/"
section = "Agentic engineering"
why = "The best in-the-trenches record of building with LLMs. Posts often — the finite edition buffers the volume; drop it if the room starts to feel Willison-shaped."

[[feeds]]
title = "Hamel Husain"
url = "https://hamel.dev/index.xml"
section = "Agentic engineering"
why = "Evals and reliability — the discipline behind spec-driven quality."

[[feeds]]
title = "Eugene Yan"
url = "https://eugeneyan.com/rss/"
section = "Agentic engineering"
why = "Applied ML/LLM systems from someone shipping in production — evals, RAG, agent patterns."

[[feeds]]
title = "Baldur Bjarnason"
url = "https://www.baldurbjarnason.com/index.xml"
section = "Agentic engineering"
why = "The counterweight — a rigorous, calm AI-skeptic, so the room pressure-tests the premise instead of echoing it."

